<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" stroke="none" role="img" aria-labelledby="title desc">
<title id="title">pfm-mefmri data journey</title>
<desc id="desc">HCP PreFreeSurfer, FreeSurfer, and PostFreeSurfer prepare individual anatomy. Distortion correction, Coreg and Headmotion, Denoise, Vol2Surf, and Concat process resting-state or task, single- or multi-echo data. Quality-control modules include registration, motion/physiology, expert-calibrated FC quality scores, and crawling-seed FC. Functional derivatives support PFM followed by TANS individualized TMS targeting, alongside task/connectivity analyses and longitudinal brain-behavior studies.</desc>
